name: Python test suite

on:
  push:
    branches:
      - fix/lifecycle-data-safety
      - main
  pull_request:
    branches:
      - main
      - fix/lifecycle-data-safety

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run full test suite
        env:
          # Unit tests use mocked/local integrations; no production credentials are needed.
          FRED_API_KEY: test-placeholder
          TELEGRAM_BOT_TOKEN: test-placeholder
          TELEGRAM_CHAT_ID: test-placeholder
          DB_PATH: /tmp/sina-quant-test-signals.db
        run: python -m pytest -q
