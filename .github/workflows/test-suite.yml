name: Python test suite

on:
  push:
    branches:
      - fix/lifecycle-data-safety
      - main
  pull_request:
    branches:
      - main
      - fix/lifecycle-data-safety

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: sina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sina_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run full test suite
        env:
          # Unit tests use mocked/local integrations; no production credentials are needed.
          FRED_API_KEY: test-placeholder
          TELEGRAM_BOT_TOKEN: test-placeholder
          TELEGRAM_CHAT_ID: test-placeholder
          DB_PATH: /tmp/sina-quant-test-signals.db
          DATABASE_URL: postgresql://postgres:test-password@localhost:5432/sina_test
        run: python -m pytest -q
