name: Full Python test suite

on:
  pull_request:
    branches:
      - main

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      FRED_API_KEY: test
      TELEGRAM_BOT_TOKEN: test
      TELEGRAM_CHAT_ID: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  ledger-performance-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run isolated Ledger lifecycle benchmark
        run: python scripts/benchmark_ledger_lifecycle.py --sizes 100 1000 10000 --repeats 2 --samples 10
