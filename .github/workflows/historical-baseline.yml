name: Historical CSV Baseline

on:
  workflow_dispatch:
  push:
    branches: [audit-fix-cli-runner]
    paths:
      - "engine/**"
      - "requirements.txt"
      - ".github/workflows/historical-baseline.yml"

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run per-symbol historical baseline
        shell: bash
        run: |
          set -o pipefail
          echo "BASELINE ONLY: CSV timestamps are interpreted as UTC (--tz-offset 0)."
          echo "Uses configured fixed spreads; commission and general slippage are not modeled."
          echo "This is not broker-validated performance and does not authorize live trading."
          for symbol in EURUSD GBPUSD USDJPY XAUUSD; do
            echo "===== HISTORICAL BASELINE: $symbol ====="
            python -m engine.cli backtest \
              --source csv \
              --csv-dir engine/data \
              --symbols "$symbol" \
              --tz-offset 0 \
              --out "out/baseline-$symbol"
          done
