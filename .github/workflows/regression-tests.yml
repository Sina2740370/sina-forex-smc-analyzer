name: Regression tests

on:
  push:
    branches:
      - fix/lifecycle-data-safety

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run engine and lifecycle regression tests
        env:
          # Tests use only local/mocked data; these satisfy import-time config validation.
          FRED_API_KEY: test-placeholder
          TELEGRAM_BOT_TOKEN: test-placeholder
          TELEGRAM_CHAT_ID: test-placeholder
          DB_PATH: /tmp/sina-quant-test-signals.db
        run: >-
          python -m pytest -q
          backend/test_signal_lifecycle.py engine/test_engine.py
          -k "test_post_expiry or test_close_signal or test_view_never_shows_forming_candles or test_no_lookahead_decision_identical_on_truncated_data or test_topdown_daily_close_respects_dst_transition or test_daily_bar_starts_at_ny_1700_winter_and_summer or test_daily_bar_across_dst_switch_keeps_17_ny or test_buy_tp or test_sell_stop"
