name: Regression tests

on:
  push:
    branches:
      - fix/lifecycle-data-safety

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run engine and lifecycle regression tests
        run: python -m pytest -q engine/test_engine.py backend/test_signal_lifecycle.py
