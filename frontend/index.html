<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sina Quant">
<link rel="manifest" href="./manifest.json">
<title>Sina Quant</title>

<style>
/* ============================================================
   SINA QUANT — MODERN BLACK / GRAPHITE UI
   ============================================================ */

:root{
  --bg:#080b12;
  --bg2:#0d111a;
  --card:#111722;
  --card2:#151c28;
  --card3:#192131;
  --border:#222c3d;
  --border2:#2b3850;
  --text:#edf2f7;
  --muted:#718096;
  --muted2:#94a3b8;
  --green:#22c55e;
  --green2:#16a34a;
  --red:#ef4444;
  --red2:#dc2626;
  --yellow:#f59e0b;
  --blue:#3b82f6;
  --blue2:#60a5fa;
  --purple:#8b5cf6;
  --shadow:0 10px 30px rgba(0,0,0,.28);
  --radius:16px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
  background:var(--bg);
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;
  background:
    radial-gradient(circle at 20% 0%,rgba(59,130,246,.08),transparent 32%),
    radial-gradient(circle at 90% 15%,rgba(139,92,246,.06),transparent 28%),
    linear-gradient(180deg,#080b12 0%,#0b0f17 55%,#080b12 100%);
  color:var(--text);
  min-height:100vh;
  padding-bottom:68px;
  overflow-x:hidden;
}

/* ---------- HEADER ---------- */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  background:rgba(8,11,18,.94);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo-icon{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:
    linear-gradient(145deg,#182337,#0d131e);
  border:1px solid var(--border2);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 5px 18px rgba(0,0,0,.25);
  font-size:20px;
}

header h1,
h1{
  font-size:1.08rem;
  font-weight:800;
  letter-spacing:.2px;
  background:linear-gradient(135deg,#f8fafc,#94a3b8);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}

.icon-btn,
.refresh{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#151d2b,#0e141f);
  border:1px solid var(--border2);
  border-radius:12px;
  color:var(--text);
  font-size:18px;
  cursor:pointer;
  transition:.2s ease;
}

.icon-btn:active,
.refresh:active{
  transform:scale(.94);
}

/* ---------- TICKER ---------- */

.ticker{
  background:rgba(10,14,22,.96);
  border-bottom:1px solid var(--border);
  overflow-x:auto;
  white-space:nowrap;
  padding:9px 0;
  scrollbar-width:none;
}

.ticker::-webkit-scrollbar{
  display:none;
}

.ticker-inner{
  display:inline-flex;
  gap:8px;
  padding:0 12px;
}

.ticker-item,
.t-item{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 11px;
  background:linear-gradient(
    145deg,
    rgba(25,33,47,.85),
    rgba(15,21,31,.85)
  );
  border:1px solid var(--border);
  border-radius:9px;
  font-size:.72rem;
  font-family:"Courier New",monospace;
  color:var(--text);
}

.t-up{
  color:var(--green);
  font-weight:700;
}

.t-down{
  color:var(--red);
  font-weight:700;
}

/* ---------- TABS ---------- */

.tabs{
  display:flex;
  background:rgba(10,14,22,.96);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:70px;
  z-index:40;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.tab{
  flex:1;
  background:none;
  border:none;
  color:var(--muted);
  font-size:.82rem;
  font-weight:700;
  padding:14px 8px;
  cursor:pointer;
  border-bottom:2px solid transparent;
  font-family:inherit;
  transition:.2s ease;
  position:relative;
}

.tab.active{
  color:#e2e8f0;
  border-bottom-color:var(--blue);
  background:linear-gradient(
    180deg,
    rgba(59,130,246,.07),
    transparent
  );
}

.tab:active{
  transform:scale(.98);
}

/* ---------- MAIN ---------- */

main{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:15px;
}

.tab-content{
  display:none;
}

.tab-content.active{
  display:block;
  animation:fadeIn .25s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ---------- LOADING ---------- */

.spin{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--blue);
  margin:0 3px;
  animation:pulse 1.4s infinite ease-in-out both;
  box-shadow:0 0 10px rgba(59,130,246,.4);
}

.spin:nth-child(2){
  animation-delay:-.16s;
}

.spin:nth-child(3){
  animation-delay:-.32s;
}

@keyframes pulse{
  0%,80%,100%{
    transform:scale(.55);
    opacity:.4;
  }
  40%{
    transform:scale(1);
    opacity:1;
  }
}

/* ---------- SCAN INFO ---------- */

.scan-info{
  background:
    linear-gradient(145deg,#141c29,#0f151f);
  border:1px solid var(--border);
  border-radius:13px;
  padding:11px 14px;
  margin-bottom:12px;
  font-size:.78rem;
  box-shadow:var(--shadow);
}

/* ---------- CARDS ---------- */

.card{
  background:
    linear-gradient(145deg,
      rgba(21,28,40,.98),
      rgba(14,19,29,.98)
    );
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  position:relative;
  overflow:hidden;
  box-shadow:
    0 8px 25px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.025);
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.card:hover{
  border-color:var(--border2);
  box-shadow:0 12px 32px rgba(0,0,0,.25);
}

.card.buy::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:2px;
  background:
    linear-gradient(
      90deg,
      transparent,
      var(--green),
      transparent
    );
}

.card.sell::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:2px;
  background:
    linear-gradient(
      90deg,
      transparent,
      var(--red),
      transparent
    );
}

.card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.name{
  font-size:.98rem;
  font-weight:800;
  color:#f1f5f9;
}

.code{
  font-size:.67rem;
  color:var(--muted);
  font-family:"Courier New",monospace;
  margin-top:2px;
}

/* ---------- BADGES ---------- */

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 9px;
  border-radius:8px;
  font-size:.7rem;
  font-weight:800;
  white-space:nowrap;
}

.badge.buy{
  background:rgba(34,197,94,.10);
  color:#4ade80;
  border:1px solid rgba(34,197,94,.25);
}

.badge.sell{
  background:rgba(239,68,68,.10);
  color:#f87171;
  border:1px solid rgba(239,68,68,.25);
}

.badge.wait{
  background:rgba(100,116,139,.10);
  color:#94a3b8;
  border:1px solid rgba(100,116,139,.25);
}

/* ---------- ROWS ---------- */

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:9px 0;
  font-size:.82rem;
  border-bottom:1px solid rgba(43,56,80,.42);
}

.row:last-child{
  border-bottom:none;
}

.row .lbl{
  color:var(--muted);
  font-size:.76rem;
}

.row .val{
  font-weight:700;
  font-family:"Courier New",monospace;
  color:#dbe4ef;
  text-align:left;
}

.green{
  color:var(--green)!important;
}

.red{
  color:var(--red)!important;
}

.yellow{
  color:var(--yellow)!important;
}

/* ---------- SL TP ---------- */

.sltp{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
  padding-top:12px;
  border-top:1px dashed var(--border);
}

.sltp-box{
  background:rgba(8,11,18,.7);
  border:1px solid rgba(43,56,80,.5);
  border-radius:10px;
  padding:10px;
  text-align:center;
}

.sltp-label{
  font-size:.68rem;
  color:var(--muted);
  margin-bottom:5px;
}

/* ---------- REASONS ---------- */

.reasons{
  margin-top:12px;
  padding-top:12px;
  border-top:1px dashed var(--border);
}

.reasons-title{
  font-size:.74rem;
  color:var(--muted);
  margin-bottom:8px;
}

.reason{
  font-size:.76rem;
  color:#aeb9c8;
  padding:7px 10px;
  background:rgba(59,130,246,.035);
  border-right:2px solid rgba(59,130,246,.7);
  border-radius:5px;
  margin-bottom:4px;
}

/* ---------- EMPTY ---------- */

.empty{
  text-align:center;
  padding:65px 20px;
  color:var(--muted);
  font-size:.85rem;
}

.empty-icon{
  font-size:46px;
  opacity:.35;
  margin-bottom:15px;
}

/* ---------- STATS ---------- */

.hero{
  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(59,130,246,.12),
      transparent 55%
    ),
    linear-gradient(145deg,#172131,#101620);
  border:1px solid var(--border);
  border-radius:16px;
  padding:23px 20px;
  text-align:center;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}

.hero-val{
  font-size:2.15rem;
  font-weight:900;
  font-family:"Courier New",monospace;
  letter-spacing:-1px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:12px;
}

.stat-box{
  background:
    linear-gradient(145deg,#151d2a,#101620);
  border:1px solid var(--border);
  border-radius:13px;
  padding:15px 10px;
  text-align:center;
  box-shadow:0 5px 18px rgba(0,0,0,.16);
}

.stat-val{
  font-size:1.35rem;
  font-weight:900;
  font-family:"Courier New",monospace;
}

.stat-lbl{
  font-size:.68rem;
  color:var(--muted);
  margin-top:5px;
}

.stats-info{
  background:
    linear-gradient(145deg,#141c29,#0f151f);
  border:1px solid var(--border);
  border-radius:13px;
  padding:16px;
  font-size:.78rem;
  line-height:2.15;
  color:#a7b3c3;
}

/* ---------- ERROR ---------- */

.err-box{
  background:
    linear-gradient(
      145deg,
      rgba(127,29,29,.72),
      rgba(69,10,10,.72)
    );
  color:#fecaca;
  border:1px solid rgba(239,68,68,.25);
  padding:12px;
  border-radius:10px;
  margin:10px 0;
  font-size:.76rem;
  white-space:pre-wrap;
  word-break:break-all;
}

/* ---------- FOOTER ---------- */

footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  min-height:52px;
  padding:10px 16px;
  background:
    linear-gradient(
      0deg,
      rgba(8,11,18,.98) 55%,
      rgba(8,11,18,.82) 75%,
      transparent
    );
  text-align:center;
  font-size:.63rem;
  color:var(--muted);
  pointer-events:none;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  z-index:30;
}

/* ---------- SCROLLBAR ---------- */

::-webkit-scrollbar{
  width:5px;
  height:5px;
}

::-webkit-scrollbar-track{
  background:#090c12;
}

::-webkit-scrollbar-thumb{
  background:#263248;
  border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
  background:#34445f;
}

/* ---------- MOBILE ---------- */

@media(max-width:520px){

  main{
    padding:12px;
  }

  header{
    padding:12px 13px;
  }

  .logo-icon{
    width:38px;
    height:38px;
  }

  header h1{
    font-size:1rem;
  }

  .tab{
    padding:13px 5px;
    font-size:.76rem;
  }

  .card{
    padding:14px;
    border-radius:14px;
  }

  .hero{
    padding:20px 15px;
  }

  .hero-val{
    font-size:2rem;
  }

  .row{
    padding:8px 0;
  }

  footer{
    font-size:.59rem;
  }
}

/* ---------- SMALL PHONES ---------- */

@media(max-width:360px){

  main{
    padding:9px;
  }

  .card{
    padding:12px;
  }

  .name{
    font-size:.9rem;
  }

  .badge{
    font-size:.64rem;
    padding:4px 7px;
  }

  .tab{
    font-size:.7rem;
  }
}

/* ---------- REDUCED MOTION ---------- */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <div class="logo-icon">📊</div>
    <h1>Sina Quant</h1>
  </div>

  <button class="icon-btn refresh" onclick="manualRefresh()" aria-label="Refresh">
    🔄
  </button>
</header>

<div class="ticker">
  <div class="ticker-inner" id="ticker">
    <div style="color:#64748b;font-size:.75rem;padding:6px 10px">
      در حال دریافت...
    </div>
  </div>
</div>

<nav class="tabs">
  <button class="tab active" onclick="showTab('live',this)">
    📈 لحظه‌ای
  </button>

  <button class="tab" onclick="showTab('signals',this)">
    🎯 سیگنال‌ها
  </button>

  <button class="tab" onclick="showTab('stats',this)">
    📊 آمار
  </button>
</nav>

<main>

  <div id="errorBox"></div>

  <section id="tab-live" class="tab-content active">

    <div id="scanInfo"></div>

    <div id="cards">

      <div class="empty">

        <div>
          <span class="spin"></span>
          <span class="spin"></span>
          <span class="spin"></span>
        </div>

        <div style="margin-top:16px">
          در حال دریافت تحلیل...
        </div>

      </div>

    </div>

  </section>

  <section id="tab-signals" class="tab-content">

    <div id="signalsList">
      <div class="empty">
        در حال بارگذاری...
      </div>
    </div>

  </section>

  <section id="tab-stats" class="tab-content">

    <div id="statsContent">
      <div class="empty">
        در حال بارگذاری...
      </div>
    </div>

  </section>

</main>

<footer>
  <span>Sina Quant v5.0</span>
  <span id="lastUpdate">-</span>
</footer>

<script>

window.onerror = function(msg,url,line){
  const eb = document.getElementById('errorBox');

  if(eb){
    eb.innerHTML =
      '<div class="err-box">' +
      '❌ JS Error: ' +
      msg +
      '\nخط: ' +
      line +
      '</div>';
  }
};

const API =
  'https://sina-forex-smc-analyzer.onrender.com';

const FLAGS = {

  'EURUSD=X':'🇪🇺🇺🇸',
  'GBPUSD=X':'🇬🇧🇺🇸',
  'USDJPY=X':'🇺🇸🇯🇵',
  'AUDUSD=X':'🇦🇺🇺🇸',
  'USDCAD=X':'🇺🇸🇨🇦',
  'NZDUSD=X':'🇳🇿🇺🇸',
  'USDCHF=X':'🇺🇸🇨🇭',
  'EURGBP=X':'🇪🇺🇬🇧',
  'EURJPY=X':'🇪🇺🇯🇵',
  'GBPJPY=X':'🇬🇧🇯🇵',
  'GC=F':'🥇'

};

function showTab(name,btn){

  document
    .querySelectorAll('.tab')
    .forEach(t => t.classList.remove('active'));

  document
    .querySelectorAll('.tab-content')
    .forEach(t => t.classList.remove('active'));

  btn.classList.add('active');

  document
    .getElementById('tab-' + name)
    .classList.add('active');

  if(name === 'signals'){
    loadSignals();
  }

  if(name === 'stats'){
    loadStats();
  }

}

async function fx(url,timeout=90000){

  const ctrl =
    new AbortController();

  const id =
    setTimeout(
      () => ctrl.abort(),
      timeout
    );

  try{

    const r =
      await fetch(
        url,
        {signal:ctrl.signal}
      );

    clearTimeout(id);

    if(!r.ok){
      throw new Error(
        'HTTP ' + r.status
      );
    }

    return await r.json();

  }catch(e){

    clearTimeout(id);
    throw e;

  }

}

function fmtP(p,s){

  if(p == null){
    return '-';
  }

  const n =
    parseFloat(p);

  if(Number.isNaN(n)){
    return '-';
  }

  return s === 'GC=F'
    ? n.toFixed(2)
    : n.toFixed(5);

}

function fmtS(v){

  if(v == null){
    return '0.00';
  }

  const n =
    parseFloat(v);

  if(Number.isNaN(n)){
    return '0.00';
  }

  return (
    n >= 0 ? '+' : ''
  ) + n.toFixed(2);

}

function trendFa(t){

  return {

    'BULLISH':'صعودی',
    'BEARISH':'نزولی',
    'RANGING':'رنج',
    'UNCLEAR':'نامشخص',
    'CONFLICT':'تضاد',
    'NEUTRAL':'خنثی'

  }[t] || t || '-';

}

function zoneFa(z){

  if(z === 'PREMIUM'){
    return 'گرون';
  }

  if(z === 'DISCOUNT'){
    return 'ارزون';
  }

  return '-';

}

function timeAgo(iso){

  try{

    const d =
      (Date.now() -
       new Date(iso).getTime()) / 1000;

    if(d < 60){
      return 'همین الان';
    }

    if(d < 3600){
      return Math.floor(d/60) +
        ' دقیقه پیش';
    }

    if(d < 86400){
      return Math.floor(d/3600) +
        ' ساعت پیش';
    }

    return Math.floor(d/86400) +
      ' روز پیش';

  }catch{

    return '-';

  }

}

async function loadPrices(){

  try{

    const d =
      await fx(
        API + '/api/prices',
        30000
      );

    if(!d.data || !d.data.length){
      return;
    }

    document.getElementById('ticker').innerHTML =
      d.data.map(p => {

        const f =
          FLAGS[p.symbol] || '💱';

        const up =
          p.direction === 'up';

        const change =
          parseFloat(p.change_pct || 0);

        const sign =
          change >= 0 ? '+' : '';

        return (

          '<div class="t-item">' +

          '<span>' +
          f +
          '</span>' +

          '<span style="color:#a0aec0">' +
          (p.name || p.symbol) +
          '</span>' +

          '<span>' +
          p.price +
          '</span>' +

          '<span class="' +
          (up ? 't-up' : 't-down') +
          '">' +

          (up ? '▲' : '▼') +
          ' ' +
          sign +
          change +
          '%' +

          '</span>' +

          '</div>'

        );

      }).join('');

  }catch(e){

    console.error('prices',e);

  }

}

async function loadLive(){

  try{

    const d =
      await fx(
        API + '/api/scan'
      );

    if(
      d.status === 'waiting' ||
      !d.data
    ){

      document.getElementById('cards').innerHTML =

        '<div class="empty">' +

        '<div class="empty-icon">⏳</div>' +

        '<div>اولین اسکن در حال اجراست</div>' +

        '</div>';

      return;

    }

    renderCards(d.data);

    document.getElementById('scanInfo').innerHTML =

      '<div class="scan-info">' +

      '<div style="display:flex;justify-content:space-between;align-items:center">' +

      '<span style="color:var(--green);font-weight:800">' +
      '● زنده' +
      '</span>' +

      '<span>' +
      (d.count || d.data.length || 0) +
