<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sina Quant">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="/manifest.json?v=3">
  <link rel="stylesheet" href="/static/style.css?v=3">
  <title>Sina Quant</title>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-icon">📊</span>
    <h1>Sina Quant</h1>
  </div>
  <button id="refreshBtn" class="icon-btn" aria-label="بازخوانی">
    <span class="refresh-icon">🔄</span>
  </button>
</header>

<section id="tickerBar" class="ticker-bar">
  <div id="tickerContent" class="ticker-content">
    <div class="ticker-loading">در حال دریافت قیمت‌ها...</div>
  </div>
</section>

<nav class="tabs">
  <button class="tab active" data-tab="live">
    <span class="tab-icon">📈</span>
    <span>لحظه‌ای</span>
  </button>
  <button class="tab" data-tab="signals">
    <span class="tab-icon">🎯</span>
    <span>سیگنال‌ها</span>
  </button>
  <button class="tab" data-tab="stats">
    <span class="tab-icon">📊</span>
    <span>آمار</span>
  </button>
</nav>

<main>
  <section id="tab-live" class="tab-content active">
    <div id="scanInfo" class="scan-info"></div>
    <div id="loading" class="spinner">
      <div class="spinner-dot"></div>
      <div class="spinner-dot"></div>
      <div class="spinner-dot"></div>
      <p>در حال دریافت تحلیل...</p>
    </div>
    <div id="cards"></div>
  </section>

  <section id="tab-signals" class="tab-content">
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">همه</button>
      <button class="filter-btn" data-filter="OPEN">باز</button>
      <button class="filter-btn" data-filter="WIN">سود</button>
      <button class="filter-btn" data-filter="LOSS">ضرر</button>
    </div>
    <div id="signalsList"></div>
  </section>

  <section id="tab-stats" class="tab-content">
    <div id="statsContent"></div>
  </section>
</main>

<footer>
  <div class="footer-info">
    <span>Sina Quant v3.0</span>
    <span id="lastUpdate">-</span>
  </div>
</footer>

<script>
  // 🔥 مهم: پاک کردن همه Service Workerهای قدیمی
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      if (registrations.length > 0) {
        console.log('🗑 پاک کردن ' + registrations.length + ' Service Worker قدیمی');
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
        // بعد از پاک کردن، صفحه رو یه بار رفرش کن
        setTimeout(function() {
          if (!sessionStorage.getItem('sw_cleared')) {
            sessionStorage.setItem('sw_cleared', '1');
            window.location.reload(true);
          }
        }, 500);
      }
    });
  }

  // پاک کردن کش‌های قدیمی
  if ('caches' in window) {
    caches.keys().then(function(keys) {
      keys.forEach(function(key) {
        if (key !== 'sina-quant-v3') {
          console.log('🗑 پاک کردن کش: ' + key);
          caches.delete(key);
        }
      });
    });
  }
</script>

<script src="/static/app.js?v=3"></script>

</body>
    </html>
