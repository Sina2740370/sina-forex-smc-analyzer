<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sina Quant</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2B4BD1">
<script>
  try { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) {}
</script>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="window.initTelegram && window.initTelegram()"></script>
<style>
:root{
  --bg:#EDF0F6; --surf:#FFFFFF; --ink:#1A2238; --mute:#66708C; --line:#D9DEEA;
  --lapis:#2B4BD1; --lapis-soft:#E3E8FB;
  --buy:#0E9F8E; --sell:#D9453D; --amber:#B97D0C;
  --buy-soft:rgba(14,159,142,.15); --sell-soft:rgba(217,69,61,.14);
}
html[data-theme="dark"]{
  --bg:#141A2E; --surf:#1D2540; --ink:#E9ECF8; --mute:#93A0C2; --line:#2E3860;
  --lapis:#8AA0FF; --lapis-soft:#26305A;
  --buy:#2DD4BF; --sell:#FF6B62; --amber:#F2B84B;
  --buy-soft:rgba(45,212,191,.18); --sell-soft:rgba(255,107,98,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font-family:"Vazirmatn","IRANSans","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  font-size:15px;line-height:1.65;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.mark{width:34px;height:34px;border-radius:9px;flex:none;object-fit:cover}
.brand{font-weight:800;font-size:18px;letter-spacing:-.2px}
.grow{flex:1}
.stat{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--buy)} .dot.warn{background:var(--amber)}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mute)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}

/* generic */
h2{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2 .count{font-weight:600;font-size:12.5px;color:var(--mute)}
.muted{color:var(--mute)}
.small{font-size:12.5px}
.notice{border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:13.5px}
.notice.warn{border-color:var(--amber)}
.empty{padding:26px 8px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.btn{display:inline-block;background:var(--lapis);color:#fff;border-radius:10px;padding:8px 16px;font-weight:600;margin-top:10px}
html[data-theme="dark"] .btn{color:#10162B}

/* price strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.tick{flex:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surf);min-width:96px}
.tick .s{font-size:12px;color:var(--mute);display:block}
.tick .p{font-weight:700;font-size:14.5px}
.tick .c{font-size:11.5px;margin-inline-start:6px}
.pos{color:var(--buy)} .neg{color:var(--sell)} .zero{color:var(--mute)}

/* test progress */
.prog{margin-top:6px}
.prog .row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--lapis);border-radius:3px}

/* ticket */
.ticket{background:var(--surf);border:1px solid var(--line);border-inline-start:4px solid var(--mute);border-radius:10px;padding:14px 14px 12px;margin-bottom:12px}
.ticket.buy{border-inline-start-color:var(--buy)} .ticket.sell{border-inline-start-color:var(--sell)}
.t-head{display:flex;align-items:flex-start;gap:10px}
.sym{font-size:19px;font-weight:800;direction:ltr;unicode-bidi:isolate;display:inline-block;letter-spacing:.2px}
.pills{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;border-radius:6px;padding:0 8px;line-height:22px;background:var(--line);color:var(--mute)}
.pill.buy{background:var(--buy-soft);color:var(--buy)} .pill.sell{background:var(--sell-soft);color:var(--sell)}
.pill.open{background:var(--lapis-soft);color:var(--lapis)}
.pill.win{background:var(--buy-soft);color:var(--buy)} .pill.loss{background:var(--sell-soft);color:var(--sell)}
.rbox{margin-inline-start:auto;text-align:end}
.rval{font-size:26px;font-weight:800;line-height:1.2}
.rcap{font-size:11.5px;color:var(--mute)}

/* the ladder */
.ladder{direction:ltr;position:relative;height:46px;margin:12px 2px 2px}
.ladder .track{position:absolute;left:0;right:0;top:26px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.zone{position:absolute;top:0;bottom:0}
.zone.loss{background:var(--sell)} .zone.gain{background:var(--buy)}
.zone.anim{animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.entry-tick{position:absolute;top:20px;width:2px;height:20px;background:var(--ink);transform:translateX(-1px);border-radius:1px}
.cur{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:11.5px;font-weight:700;color:var(--lapis)}
.cur::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--lapis);border:2px solid var(--surf);margin-top:3px;margin-bottom:-2px;position:relative;top:2px}
.cur.exit::after{background:var(--surf);border-color:var(--lapis)}
.cells{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.cell{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}
.cell .lbl{display:block;font-size:11.5px;color:var(--mute);direction:rtl}
.cell .num{font-weight:700;font-size:14.5px}
.cell.sl{border-color:var(--sell-soft);background:var(--sell-soft)} .cell.tp{border-color:var(--buy-soft);background:var(--buy-soft)}
.cell:active{transform:scale(.97)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--mute)}
.meta b{color:var(--ink);font-weight:700}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.reasons span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 8px;line-height:22px}

/* list rows */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-size:13.5px;background:var(--surf);color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--lapis);border-color:var(--lapis);color:#fff}
html[data-theme="dark"] .chip[aria-pressed="true"]{color:#10162B}
.list{margin-top:10px}
.item{border-bottom:1px solid var(--line)}
.item > .row{width:100%;display:flex;align-items:center;gap:10px;padding:12px 2px;text-align:start}
.item .sym{font-size:16px}
.item .when{font-size:12px;color:var(--mute)}
.item .rv{margin-inline-start:auto;font-weight:700;font-size:15px}
.item .ticket{margin:2px 0 12px}

/* stats */
.banner{border-radius:10px;padding:12px 14px;font-weight:600;background:var(--lapis-soft);color:var(--lapis)}
.banner.ok{background:var(--buy-soft);color:var(--buy)}
.crit{padding:12px 0;border-bottom:1px solid var(--line)}
.crit .row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;font-size:14px}
.crit .row .need{font-size:12px;color:var(--mute)}
.meter{position:relative;height:8px;background:var(--line);border-radius:4px;direction:ltr}
.meter > i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--lapis)}
.meter > i.pass{background:var(--buy)} .meter > i.fail{background:var(--sell)}
.meter > u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);text-decoration:none;border-radius:1px}
.kv{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.kv div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--mute)}
.chart{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:600;color:var(--mute);font-size:12px;text-align:start;padding:6px 0;border-bottom:1px solid var(--line)}
td{padding:9px 0;border-bottom:1px solid var(--line)}
td:not(:first-child),th:not(:first-child){text-align:end}

/* calculator */
.field{display:block;margin-bottom:12px}
.field > span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.field input,.field select{width:100%;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;direction:ltr;text-align:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--surf);text-align:center;margin-top:4px}
.result .big{font-size:38px;font-weight:800;line-height:1.2}
.fill{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* tab bar + toast */
nav{position:fixed;inset-inline:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11.5px;color:var(--mute);position:relative}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--lapis);font-weight:700}
nav button[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--lapis)}
#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:9;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span id="logo"></span>
    <span class="brand">Sina Quant</span>
    <span class="grow"></span>
    <span class="stat"><i class="dot" id="dot"></i><span id="scan">در حال اتصال</span></span>
    <button class="icon-btn" id="refresh" aria-label="بروزرسانی">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </header>
  <main id="view"></main>
</div>

<nav aria-label="بخش‌ها"><div class="in" id="tabs"></div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = s => String(s || "").toUpperCase().replace(/=X$/, "").replace(/[\/\-_ ]/g, "");
const isBuy = s => /buy|long/i.test(s.direction || "");
const px = v => { if (v == null || isNaN(v)) return "—"; v = +v; const a = Math.abs(v); return v.toFixed(a >= 1000 ? 2 : a >= 20 ? 3 : 5); };
const sgn = (v, d = 2) => (v > 0 ? "+" : "") + v.toFixed(d);
const cls = v => v > 0.005 ? "pos" : v < -0.005 ? "neg" : "zero";
const firstNum = (o, keys) => { for (const k of keys) { const v = o[k]; if (v != null && v !== "" && !isNaN(+v)) return +v; } return null; };

function parseUTC(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return new Date(v < 1e12 ? v * 1000 : v);
  let s = String(v).trim().replace(" ", "T");
  if (!/Z|[+-]\d\d:?\d\d$/.test(s)) s += "Z";
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function ago(d) {
  if (!d) return "";
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "همین الان";
  if (m < 60) return m + " دقیقه پیش";
  const h = Math.round(m / 60);
  if (h < 24) return h + " ساعت پیش";
  return Math.round(h / 24) + " روز پیش";
}
function when(d) {
  if (!d) return "";
  try { return d.toLocaleString("fa-IR-u-nu-latn", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); }
  catch (e) { return d.toLocaleString("en-GB"); }
}
function rrOf(s) { const risk = Math.abs(s.entry - s.sl); return risk ? Math.abs(s.tp - s.entry) / risk : null; }
function calcR(s, price) {
  const risk = Math.abs(s.entry - s.sl);
  if (!risk || price == null) return null;
  return (isBuy(s) ? 1 : -1) * (price - s.entry) / risk;
}
function resultR(s) {
  if (s.status === "EXPIRED") return 0;
  if (s.status === "OPEN") return null;
  if (s.exit_price != null) return calcR(s, +s.exit_price);
  if (s.status === "WIN") return rrOf(s);
  if (s.status === "LOSS") return -1;
  return null;
}
const STATUS = { OPEN: ["باز", "open"], WIN: ["سود", "win"], LOSS: ["ضرر", "loss"], EXPIRED: ["منقضی", ""] };

/* ---------- state ---------- */
const S = {
  tab: sessionStorage.getItem("sq_tab") || "today",
  cfg: null, stats: null, signals: [], open: [], prices: {}, health: null,
  loaded: false, failed: false, wake: false, animate: true,
  filter: "all", expanded: new Set(), busy: false
};

/* ---------- telegram ---------- */
const tg = () => window.Telegram && window.Telegram.WebApp;
window.initTelegram = function () {
  const w = tg(); if (!w) return;
  try { w.ready(); w.expand(); } catch (e) {}
  try { if (w.disableVerticalSwipes) w.disableVerticalSwipes(); } catch (e) {}
  if (w.colorScheme) document.documentElement.dataset.theme = w.colorScheme === "dark" ? "dark" : "light";
  const dark = document.documentElement.dataset.theme === "dark";
  try { w.setHeaderColor(dark ? "#141A2E" : "#EDF0F6"); w.setBackgroundColor(dark ? "#141A2E" : "#EDF0F6"); } catch (e) {}
};
if (window.Telegram) window.initTelegram();

/* ---------- api ---------- */
async function api(path, timeout = 30000) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), timeout);
  const headers = {}; const w = tg();
  if (w && w.initData) headers["X-Telegram-Init-Data"] = w.initData; // برای مرحله امنیت آماده است
  try {
    const r = await fetch(path, { headers, signal: ctl.signal, cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

async function loadFast() {
  const [o, p, h] = await Promise.allSettled([api("/api/signals/open"), api("/api/prices"), api("/api/health")]);
  if (o.status === "fulfilled" && Array.isArray(o.value)) S.open = o.value;
  if (p.status === "fulfilled" && p.value && Array.isArray(p.value.data)) {
    const m = {};
    for (const it of p.value.data) {
      const k = norm(it.symbol || it.ticker || it.name);
      const price = firstNum(it, ["price", "close", "last", "bid", "current", "rate"]);
      if (k && price != null) m[k] = { price, change: firstNum(it, ["change_pct", "change_percent", "pct_change", "percent_change"]) };
    }
    S.prices = m;
  }
  if (h.status === "fulfilled") S.health = h.value;
  render();
}
async function loadFull() {
  const [c, st, sg] = await Promise.allSettled([api("/api/config"), api("/api/stats"), api("/api/signals?limit=1000")]);
  if (c.status === "fulfilled") S.cfg = c.value;
  if (st.status === "fulfilled") S.stats = st.value;
  if (sg.status === "fulfilled" && Array.isArray(sg.value)) S.signals = sg.value;
  const anyOk = [c, st, sg].some(x => x.status === "fulfilled");
  if (anyOk) { S.loaded = true; S.failed = false; S.wake = false; } else if (!S.loaded) S.failed = true;
  render();
}
async function refreshAll() {
  if (S.busy) return; S.busy = true; $("#refresh").classList.add("spin");
  try { await Promise.all([loadFast(), loadFull()]); } finally { S.busy = false; $("#refresh").classList.remove("spin"); }
}

/* ---------- components ---------- */
function ladder(s, price) {
  const e = +s.entry, sl = +s.sl, tp = +s.tp;
  const closed = s.status !== "OPEN";
  const cur = closed ? (s.exit_price != null ? +s.exit_price : null) : (price != null ? price : null);
  const pts = [e, sl, tp]; if (cur != null) pts.push(cur);
  let lo = Math.min(...pts), hi = Math.max(...pts);
  const pad = (hi - lo) * 0.07 || 1e-6; lo -= pad; hi += pad;
  const pos = v => (v - lo) / (hi - lo) * 100;
  const an = S.animate ? " anim" : "";
  const zone = (a, b, kind, origin) => {
    const l = Math.min(pos(a), pos(b)), w = Math.abs(pos(a) - pos(b));
    return `<i class="zone ${kind}${an}" style="left:${l}%;width:${w}%;transform-origin:${origin}"></i>`;
  };
  // ناحیه‌ها از سمت قیمت ورود باز می‌شن
  const lossZ = zone(sl, e, "loss", sl < e ? "right" : "left");
  const gainZ = zone(e, tp, "gain", tp > e ? "left" : "right");
  const curEl = cur == null ? "" :
    `<span class="cur${closed ? " exit" : ""}" style="left:${Math.min(94, Math.max(6, pos(cur)))}%">${px(cur)}</span>`;
  return `<div class="ladder" aria-hidden="true"><div class="track">${lossZ}${gainZ}</div><i class="entry-tick" style="left:${pos(e)}%"></i>${curEl}</div>`;
}

function ticket(s) {
  const buy = isBuy(s), open = s.status === "OPEN";
  const price = open && S.prices[norm(s.symbol)] ? S.prices[norm(s.symbol)].price : null;
  const r = open ? calcR(s, price) : resultR(s);
  const rr = rrOf(s);
  const order = buy ? ["sl", "entry", "tp"] : ["tp", "entry", "sl"];
  const lbl = { sl: "حد ضرر", entry: "ورود", tp: "حد سود" };
  const cells = order.map(k => `<button class="cell ${k}" data-copy="${px(s[k])}" aria-label="کپی ${lbl[k]}"><span class="lbl">${lbl[k]}</span><span class="num">${px(s[k])}</span></button>`).join("");
  const st = STATUS[s.status] || [s.status, ""];
  const cap = open ? (price != null ? "شناور" : "بدون قیمت زنده") : (s.status === "EXPIRED" ? "منقضی شد" : "نتیجه");
  const rHtml = r == null ? `<div class="rval zero">—</div>` : `<div class="rval num ${cls(r)}">${sgn(r)}R</div>`;
  const reasons = (s.reasons || []).map(x => `<span>${esc(x)}</span>`).join("");
  const d = parseUTC(s.created_at);
  return `<article class="ticket ${buy ? "buy" : "sell"}">
    <div class="t-head">
      <div>
        <span class="sym">${esc(norm(s.symbol))}</span>
        <div class="pills"><span class="pill ${buy ? "buy" : "sell"}">${buy ? "خرید" : "فروش"}</span><span class="pill ${st[1]}">${st[0]}</span></div>
      </div>
      <div class="rbox">${rHtml}<div class="rcap">${cap}</div></div>
    </div>
    ${ladder(s, price)}
    <div class="cells">${cells}</div>
    <div class="meta">
      ${rr ? `<span>ریسک به ریوارد <b class="num">1:${rr.toFixed(1)}</b></span>` : ""}
      ${s.score != null ? `<span>امتیاز <b class="num">${(+s.score).toFixed(1)}</b></span>` : ""}
      ${s.pnl_pips != null && !open ? `<span>پیپ <b class="num ${cls(s.pnl_pips)}">${sgn(+s.pnl_pips, 1)}</b></span>` : ""}
      <span title="${esc(when(d))}">${ago(d)}</span>
    </div>
    ${reasons ? `<div class="reasons">${reasons}</div>` : ""}
  </article>`;
}

function equitySvg(pts) {
  const W = 320, H = 130, P = 10;
  const min = Math.min(0, ...pts), max = Math.max(0, ...pts), span = (max - min) || 1;
  const x = i => P + (W - 2 * P) * (i / (pts.length - 1));
  const y = v => P + (H - 2 * P) * (1 - (v - min) / span);
  const line = pts.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join("");
  const area = line + `L${x(pts.length - 1).toFixed(1)} ${y(0).toFixed(1)}L${x(0).toFixed(1)} ${y(0).toFixed(1)}Z`;
  const up = pts[pts.length - 1] >= 0, col = up ? "var(--buy)" : "var(--sell)";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="منحنی سود و ضرر بر حسب R">
    <line x1="${P}" x2="${W - P}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-dasharray="4 4"/>
    <path d="${area}" fill="${col}" opacity=".12"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(pts[pts.length - 1])}" r="3.5" fill="${col}"/>
  </svg>`;
}

function meter(label, valueTxt, needTxt, value, ref, higherBetter) {
  const pass = higherBetter ? value >= ref : value <= ref;
  const top = Math.max(value, ref) * 1.25 || 1;
  return `<div class="crit">
    <div class="row"><span>${label}</span><span><b class="num ${pass ? "pos" : ""}">${valueTxt}</b> <span class="need">${needTxt}</span></span></div>
    <div class="meter"><i class="${pass ? "pass" : (higherBetter ? "" : "fail")}" style="width:${Math.min(100, value / top * 100)}%"></i><u style="left:${ref / top * 100}%"></u></div>
  </div>`;
}

/* ---------- views ---------- */
function viewToday() {
  const cfg = S.cfg || {}, dur = cfg.test_duration_days;
  let html = "";
  const keys = Object.keys(S.prices);
  if (keys.length) {
    html += `<div class="strip">` + keys.map(k => {
      const p = S.prices[k];
      return `<div class="tick"><span class="s num">${esc(k)}</span><span class="p num">${px(p.price)}</span>${p.change != null ? `<span class="c num ${cls(p.change)}">${sgn(p.change)}%</span>` : ""}</div>`;
    }).join("") + `</div>`;
  }
  if (S.signals.length && dur) {
    const first = S.signals.map(s => parseUTC(s.created_at)).filter(Boolean).sort((a, b) => a - b)[0];
    if (first) {
      const day = Math.floor((Date.now() - first) / 864e5) + 1;
      const done = day > dur;
      html += `<div class="prog"><div class="row"><span>تست ${dur} روزه</span><span class="num">${done ? "تمام شد" : "روز " + day + " از " + dur}</span></div>
        <div class="bar"><i style="width:${Math.min(100, day / dur * 100)}%"></i></div></div>`;
    }
  }
  html += `<h2>سیگنال‌های باز <span class="count num">${S.open.length}</span></h2>`;
  if (S.open.length) html += S.open.map(ticket).join("");
  else {
    const last = S.health && parseUTC(S.health.last_scan);
    html += `<div class="empty"><b>الان سیگنال بازی نیست</b>${last ? "آخرین اسکن " + ago(last) + " انجام شد" : "منتظر اسکن بعدی"}.</div>`;
  }
  const h = S.health;
  if (h) html += `<div class="kv" style="margin-top:8px"><div><span>اسکن‌ها</span><b class="num">${h.scans ?? 0}</b></div><div><span>سیگنال امروز</span><b class="num">${h.signals_today ?? 0}</b></div><div><span>خطاها</span><b class="num">${h.errors ?? 0}</b></div><div><span>دیتابیس</span><b class="num">${esc(h.db_type || "")}</b></div></div>`;
  return html;
}

function viewSignals() {
  const F = [["all", "همه"], ["OPEN", "باز"], ["WIN", "سود"], ["LOSS", "ضرر"], ["EXPIRED", "منقضی"]];
  const chips = `<div class="chips">` + F.map(f => `<button class="chip" data-filter="${f[0]}" aria-pressed="${S.filter === f[0]}">${f[1]}</button>`).join("") + `</div>`;
  const rows = S.signals.filter(s => S.filter === "all" || s.status === S.filter);
  if (!rows.length) return chips + `<div class="empty"><b>چیزی برای نمایش نیست</b>با فیلتر دیگه امتحان کن.</div>`;
  return chips + `<div class="list">` + rows.map(s => {
    const st = STATUS[s.status] || [s.status, ""], open = S.expanded.has(s.id);
    const r = s.status === "OPEN" ? null : resultR(s);
    return `<div class="item"><button class="row" data-toggle="${s.id}" aria-expanded="${open}">
      <span class="sym">${esc(norm(s.symbol))}</span>
      <span class="pill ${isBuy(s) ? "buy" : "sell"}">${isBuy(s) ? "خرید" : "فروش"}</span>
      <span class="pill ${st[1]}">${st[0]}</span>
      <span class="rv num ${r == null ? "zero" : cls(r)}">${r == null ? "" : sgn(r) + "R"}</span>
      <span class="when">${ago(parseUTC(s.created_at))}</span>
    </button>${open ? ticket(s) : ""}</div>`;
  }).join("") + `</div>`;
}

function viewStats() {
  const st = S.stats, cfg = S.cfg;
  if (!st) return `<div class="empty"><b>آمار هنوز آماده نیست</b>چند لحظه بعد بروزرسانی کن.</div>`;
  const ref = cfg ? cfg.max_drawdown : 0.1;
  const dd = ref <= 1 ? st.max_drawdown_pct * 100 : st.max_drawdown_pct;
  const ddRef = ref <= 1 ? ref * 100 : ref;
  let html = `<div class="banner ${st.ready_for_live ? "ok" : ""}">${st.ready_for_live ? "همه معیارهای تست برقراره" : "هنوز همه معیارهای تست برقرار نیست"}</div>`;
  html += `<h2>معیارهای تست</h2>`;
  if (cfg) {
    html += meter("تعداد معامله", st.total, "حداقل " + cfg.min_trades, st.total, cfg.min_trades, true);
    html += meter("نرخ برد", (st.win_rate * 100).toFixed(1) + "%", "حداقل " + (cfg.min_win_rate * 100).toFixed(0) + "%", st.win_rate, cfg.min_win_rate, true);
    html += meter("پروفیت فاکتور", st.profit_factor.toFixed(2), "حداقل " + cfg.min_profit_factor, st.profit_factor, cfg.min_profit_factor, true);
    html += meter("دراودان", dd.toFixed(1) + "%", "حداکثر " + ddRef.toFixed(0) + "%", dd, ddRef, false);
  }
  html += `<h2>خلاصه</h2><div class="kv">
    <div><span>برد</span><b class="num">${st.wins}</b></div><div><span>باخت</span><b class="num">${st.losses}</b></div>
    <div><span>منقضی</span><b class="num">${st.expired_signals}</b></div><div><span>باز</span><b class="num">${st.open_signals}</b></div>
    <div><span>مجموع R</span><b class="num ${cls(st.total_r)}">${sgn(st.total_r)}</b></div><div><span>مجموع پیپ</span><b class="num ${cls(st.total_pips)}">${sgn(st.total_pips, 1)}</b></div></div>`;

  const closed = S.signals.filter(s => s.status !== "OPEN").sort((a, b) => (parseUTC(a.closed_at || a.created_at) || 0) - (parseUTC(b.closed_at || b.created_at) || 0));
  html += `<h2>منحنی سود و ضرر (R)</h2>`;
  if (closed.length >= 2) {
    let c = 0; const pts = [0]; closed.forEach(s => { c += resultR(s) || 0; pts.push(c); });
    html += equitySvg(pts);
  } else html += `<div class="empty">بعد از بسته شدن چند سیگنال، منحنی اینجا کشیده می‌شه.</div>`;

  const by = {};
  closed.forEach(s => { const k = norm(s.symbol); const o = by[k] || (by[k] = { n: 0, w: 0, r: 0 }); o.n++; if (s.status === "WIN") o.w++; o.r += resultR(s) || 0; });
  const keys = Object.keys(by).sort((a, b) => by[b].r - by[a].r);
  if (keys.length) {
    html += `<h2>عملکرد هر نماد</h2><table><thead><tr><th>نماد</th><th>تعداد</th><th>نرخ برد</th><th>مجموع R</th></tr></thead><tbody>` +
      keys.map(k => `<tr><td class="num">${esc(k)}</td><td class="num">${by[k].n}</td><td class="num">${(by[k].w / by[k].n * 100).toFixed(0)}%</td><td class="num ${cls(by[k].r)}">${sgn(by[k].r)}</td></tr>`).join("") + `</tbody></table>`;
  }
  return html;
}

function viewTools() {
  const set = new Set(["EURUSD", "GBPUSD", "USDJPY", "XAUUSD", "AUDUSD", "USDCAD", "USDCHF", "NZDUSD"]);
  S.signals.forEach(s => set.add(norm(s.symbol)));
  const opts = [...set].map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join("");
  let bal = "", risk = "0.5";
  try { bal = localStorage.getItem("sq_bal") || ""; risk = localStorage.getItem("sq_risk") || "0.5"; } catch (e) {}
  const fills = S.open.map(s => `<button class="chip" data-fill="${s.id}">${esc(norm(s.symbol))} ${isBuy(s) ? "خرید" : "فروش"}</button>`).join("");
  return `<h2>ماشین‌حساب لات</h2>
    ${fills ? `<div class="small muted" style="margin-bottom:6px">پر کردن از سیگنال باز</div><div class="fill">${fills}</div>` : ""}
    <div class="two">
      <label class="field"><span>موجودی حساب (دلار)</span><input id="c-bal" type="number" inputmode="decimal" value="${esc(bal)}" placeholder="100"></label>
      <label class="field"><span>ریسک هر معامله (درصد)</span><input id="c-risk" type="number" inputmode="decimal" step="0.1" value="${esc(risk)}"></label>
    </div>
    <label class="field"><span>نماد</span><select id="c-sym">${opts}</select></label>
    <div class="two">
      <label class="field"><span>قیمت ورود</span><input id="c-entry" type="number" inputmode="decimal" step="any"></label>
      <label class="field"><span>حد ضرر</span><input id="c-sl" type="number" inputmode="decimal" step="any"></label>
    </div>
    <div class="result" id="c-out"><div class="muted">موجودی، ورود و حد ضرر رو بنویس</div></div>
    <p class="small muted">قرارداد استاندارد ۱۰۰٬۰۰۰ واحدی حساب شده. برای حساب سنت یا میکرو، لات رو با نوع حساب کنترل کن. نمادهای کراس (مثل EURJPY) نرخ تبدیل لازم دارن و اینجا پشتیبانی نمی‌شن.</p>`;
}

function calc() {
  const bal = +$("#c-bal").value, risk = +$("#c-risk").value, e = +$("#c-entry").value, sl = +$("#c-sl").value, sym = norm($("#c-sym").value);
  try { localStorage.setItem("sq_bal", $("#c-bal").value); localStorage.setItem("sq_risk", $("#c-risk").value); } catch (x) {}
  const out = $("#c-out");
  if (!(bal > 0 && risk > 0 && e > 0 && sl > 0)) { out.innerHTML = `<div class="muted">موجودی، ورود و حد ضرر رو بنویس</div>`; return; }
  const dist = Math.abs(e - sl);
  if (!dist) { out.innerHTML = `<div class="neg">ورود و حد ضرر نباید برابر باشن</div>`; return; }
  let per = null;
  if (sym.startsWith("XAU")) per = dist * 100;
  else if (sym.startsWith("XAG")) per = dist * 5000;
  else if (sym.endsWith("USD")) per = dist * 100000;
  else if (sym.startsWith("USD")) per = dist * 100000 / e;
  if (per == null) { out.innerHTML = `<div class="muted">برای ${esc(sym)} نرخ تبدیل لازمه و این ماشین‌حساب پشتیبانی نمی‌کنه</div>`; return; }
  const riskUsd = bal * risk / 100;
  const lots = Math.floor(riskUsd / per * 100) / 100;
  if (lots < 0.01) {
    out.innerHTML = `<div class="neg" style="font-weight:700">کمتر از ۰٫۰۱ لات</div><div class="small muted">حتی ۰٫۰۱ لات حدود <span class="num">$${(per * 0.01).toFixed(2)}</span> ریسک داره؛ از ریسک انتخابی (<span class="num">$${riskUsd.toFixed(2)}</span>) بیشتره.</div>`;
    return;
  }
  out.innerHTML = `<div class="big num">${lots.toFixed(2)}</div><div class="muted">لات</div>
    <div class="small muted" style="margin-top:6px">ریسک واقعی حدود <span class="num">$${(lots * per).toFixed(2)}</span> از <span class="num">$${riskUsd.toFixed(2)}</span></div>`;
}

/* ---------- shell ---------- */
const TABS = [
  ["today", "امروز", '<path d="M3 12h4l3-8 4 16 3-8h4"/>'],
  ["signals", "سیگنال‌ها", '<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>'],
  ["stats", "آمار", '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
  ["tools", "ابزار", '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/>']
];
function drawTabs() {
  $("#tabs").innerHTML = TABS.map(t => `<button data-tab="${t[0]}" ${S.tab === t[0] ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${t[2]}</svg>${t[1]}</button>`).join("");
}
function drawStatus() {
  const h = S.health, last = h && parseUTC(h.last_scan);
  const fresh = last && (Date.now() - last) < 30 * 60000;
  $("#dot").className = "dot " + (h ? (fresh ? "ok" : "warn") : "");
  $("#scan").textContent = h ? (last ? "اسکن " + ago(last) : "آنلاین") : "در حال اتصال";
}

function render(force) {
  drawStatus();
  const view = $("#view");
  if (!S.loaded) {
    view.innerHTML = S.failed
      ? `<div class="empty"><b>به سرور وصل نشد</b>اینترنت یا وضعیت سرور رو چک کن.<br><button class="btn" data-retry="1">تلاش دوباره</button></div>`
      : `${S.wake ? `<div class="notice warn">سرور روی Render در حال بیدار شدنه؛ تا یک دقیقه طول می‌کشه.</div>` : ""}<div class="empty">در حال بارگذاری…</div>`;
    return;
  }
  if (S.tab === "tools" && !force) return; // ورودی‌های ماشین‌حساب با رفرش خودکار پاک نشن
  view.innerHTML = S.tab === "signals" ? viewSignals() : S.tab === "stats" ? viewStats() : S.tab === "tools" ? viewTools() : viewToday();
  if (S.tab === "tools") calc();
  if (S.animate && S.open.length && S.tab === "today") requestAnimationFrame(() => { S.animate = false; });
}

/* ---------- events ---------- */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (x) {} ta.remove();
  }
  try { const w = tg(); w && w.HapticFeedback && w.HapticFeedback.impactOccurred("light"); } catch (e) {}
  const t = $("#toast"); t.textContent = "کپی شد " + text; t.classList.add("on");
  clearTimeout(copyText.t); copyText.t = setTimeout(() => t.classList.remove("on"), 1400);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy],[data-tab],[data-filter],[data-toggle],[data-fill],[data-retry]");
  if (!b) return;
  if (b.dataset.copy) return copyText(b.dataset.copy);
  if (b.dataset.tab) { S.tab = b.dataset.tab; sessionStorage.setItem("sq_tab", S.tab); drawTabs(); render(true); window.scrollTo(0, 0); return; }
  if (b.dataset.filter) { S.filter = b.dataset.filter; return render(true); }
  if (b.dataset.toggle) { const id = +b.dataset.toggle; S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); return render(true); }
  if (b.dataset.retry) { S.failed = false; render(); return refreshAll(); }
  if (b.dataset.fill) {
    const s = S.open.find(x => String(x.id) === b.dataset.fill); if (!s) return;
    const k = norm(s.symbol), sel = $("#c-sym");
    if (![...sel.options].some(o => o.value === k)) sel.add(new Option(k, k));
    sel.value = k; $("#c-entry").value = s.entry; $("#c-sl").value = s.sl; calc();
  }
});
document.addEventListener("input", e => { if (e.target.closest("#c-bal,#c-risk,#c-entry,#c-sl,#c-sym")) calc(); });
document.addEventListener("change", e => { if (e.target.id === "c-sym") calc(); });
$("#refresh").addEventListener("click", refreshAll);

/* ---------- boot ---------- */
(function () {
  // لوگو: اگر /static/logo.png وجود داشته باشه استفاده می‌شه، وگرنه نشان ساده
  const mark = `<svg class="mark" viewBox="0 0 34 34"><rect width="34" height="34" rx="9" fill="#2B4BD1"/><path d="M10 9v16M17 6v19M24 12v13" stroke="#fff" stroke-width="2" stroke-linecap="round"/><rect x="7.5" y="13" width="5" height="7" rx="1" fill="#2DD4BF"/><rect x="14.5" y="10" width="5" height="9" rx="1" fill="#fff"/><rect x="21.5" y="16" width="5" height="6" rx="1" fill="#FF6B62"/></svg>`;
  $("#logo").innerHTML = mark;
  const img = new Image(); img.className = "mark"; img.alt = "";
  img.onload = () => { $("#logo").replaceChildren(img); };
  img.src = "/static/logo.png";
})();
drawTabs(); render();
setTimeout(() => { if (!S.loaded && !S.failed) { S.wake = true; render(); } }, 6000);
refreshAll();
setInterval(() => { if (!document.hidden && S.loaded) loadFast(); }, 30000);
setInterval(() => { if (!document.hidden && S.loaded) loadFull(); }, 180000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.loaded) loadFast(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
