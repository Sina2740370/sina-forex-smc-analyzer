<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<title>Sina Quant</title>
<style>
:root{
  --bg:#0a0e17;--card:#151b28;--border:#23304a;--text:#e6edf5;
  --muted:#64748b;--green:#22c55e;--red:#ef4444;--accent:#3b82f6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:linear-gradient(180deg,#0f1520,#0a0e17);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
h1{font-size:1.1rem;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.refresh{background:var(--card);border:1px solid var(--border);border-radius:50%;width:42px;height:42px;font-size:18px;color:var(--text);cursor:pointer}
.tabs{display:flex;background:#0f1520;border-bottom:1px solid var(--border);position:sticky;top:71px;z-index:9}
.tab{flex:1;background:none;border:none;color:var(--muted);font-size:.85rem;font-weight:600;padding:14px 8px;cursor:pointer;border-bottom:2.5px solid transparent;font-family:inherit}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
main{padding:14px;max-width:720px;margin:0 auto}
.tab-content{display:none}
.tab-content.active{display:block}
.ticker{background:#0f1520;border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap;padding:8px 0;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.ticker-inner{display:inline-flex;gap:8px;padding:0 10px}
.t-item{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(35,48,74,.4);border:1px solid var(--border);border-radius:8px;font-size:.72rem;font-family:'Courier New',monospace}
.t-up{color:var(--green)}.t-down{color:var(--red)}
.card{background:linear-gradient(160deg,#151b28,#1a2130);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.card.buy::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#22c55e,transparent)}
.card.sell::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ef4444,transparent)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.name{font-size:1rem;font-weight:700}
.code{font-size:.68rem;color:var(--muted);font-family:monospace}
.badge{padding:5px 10px;border-radius:7px;font-size:.72rem;font-weight:800}
.badge.buy{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.badge.sell{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.badge.wait{background:rgba(100,116,139,.15);color:var(--muted);border:1px solid rgba(100,116,139,.3)}
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:.85rem;border-bottom:1px solid rgba(35,48,74,.5)}
.row:last-child{border-bottom:none}
.row .lbl{color:var(--muted);font-size:.78rem}
.row .val{font-weight:600;font-family:monospace}
.green{color:var(--green)}.red{color:var(--red)}.yellow{color:#f59e0b}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:48px;opacity:.4;margin-bottom:16px}
.spin{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin:0 4px;animation:b 1.4s infinite ease-in-out both}
.spin:nth-child(2){animation-delay:-.16s}.spin:nth-child(3){animation-delay:-.32s}
@keyframes b{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.stat-val{font-size:1.4rem;font-weight:800;font-family:monospace}
.stat-lbl{font-size:.72rem;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.hero{background:linear-gradient(160deg,#1a2130,#151b28);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center;margin-bottom:12px}
.hero-val{font-size:2rem;font-weight:800;font-family:monospace}
footer{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:linear-gradient(0deg,#0f1520 60%,transparent);text-align:center;font-size:.65rem;color:var(--muted);pointer-events:none;display:flex;justify-content:space-between}
.err-box{background:#7f1d1d;color:#fecaca;padding:12px;border-radius:8px;margin:10px 0;font-size:.8rem;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-size:22px">📊</span>
    <h1>Sina Quant</h1>
  </div>
  <button class="refresh" onclick="manualRefresh()">🔄</button>
</header>

<div class="ticker">
  <div class="ticker-inner" id="ticker">
    <div style="color:#64748b;font-size:.75rem;padding:6px 10px">در حال دریافت...</div>
  </div>
</div>

<nav class="tabs">
  <button class="tab active" onclick="showTab('live',this)">📈 لحظه‌ای</button>
  <button class="tab" onclick="showTab('signals',this)">🎯 سیگنال‌ها</button>
  <button class="tab" onclick="showTab('stats',this)">📊 آمار</button>
</nav>

<main>
  <div id="errorBox"></div>

  <section id="tab-live" class="tab-content active">
    <div id="scanInfo"></div>
    <div id="cards">
      <div class="empty">
        <div><span class="spin"></span><span class="spin"></span><span class="spin"></span></div>
        <div style="margin-top:16px">در حال دریافت تحلیل...</div>
      </div>
    </div>
  </section>

  <section id="tab-signals" class="tab-content">
    <div id="signalsList"><div class="empty">در حال بارگذاری...</div></div>
  </section>

  <section id="tab-stats" class="tab-content">
    <div id="statsContent"><div class="empty">در حال بارگذاری...</div></div>
  </section>
</main>

<footer>
  <span>Sina Quant v4.0</span>
  <span id="lastUpdate">-</span>
</footer>

<script>
// نمایش خطاها
window.onerror = function(msg, url, line) {
  const eb = document.getElementById('errorBox');
  eb.innerHTML = '<div class="err-box">❌ JS Error: ' + msg + '\nخط: ' + line + '</div>';
};

const API = 'https://sina-forex-smc-analyzer.onrender.com';
const FLAGS = {
  'EURUSD=X':'🇪🇺🇺🇸','GBPUSD=X':'🇬🇧🇺🇸','USDJPY=X':'🇺🇸🇯🇵',
  'AUDUSD=X':'🇦🇺🇺🇸','USDCAD=X':'🇺🇸🇨🇦','NZDUSD=X':'🇳🇿🇺🇸',
  'USDCHF=X':'🇺🇸🇨🇭','EURGBP=X':'🇪🇺🇬🇧','EURJPY=X':'🇪🇺🇯🇵',
  'GBPJPY=X':'🇬🇧🇯🇵','GC=F':'🥇'
};

// Tab switching
function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'signals') loadSignals();
  if (name === 'stats') loadStats();
}

// Fetch with timeout
async function fx(url, timeout = 90000) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), timeout);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(id);
    return await r.json();
  } catch(e) {
    clearTimeout(id);
    throw e;
  }
}

// Format
function fmtP(p, s) {
  if (p == null) return '-';
  return s === 'GC=F' ? p.toFixed(2) : p.toFixed(5);
}
function fmtS(v) {
  if (v == null) return '0.00';
  return (v >= 0 ? '+' : '') + parseFloat(v).toFixed(2);
}
function trendFa(t) {
  return {'BULLISH':'صعودی','BEARISH':'نزولی','RANGING':'رنج',
    'UNCLEAR':'نامشخص','CONFLICT':'تضاد','NEUTRAL':'خنثی'}[t] || t || '-';
}
function zoneFa(z) {
  return z === 'PREMIUM' ? 'گرون' : z === 'DISCOUNT' ? 'ارزون' : '-';
}
function timeAgo(iso) {
  try {
    const d = (Date.now() - new Date(iso).getTime()) / 1000;
    if (d < 60) return 'همین الان';
    if (d < 3600) return Math.floor(d/60) + ' دقیقه پیش';
    if (d < 86400) return Math.floor(d/3600) + ' ساعت پیش';
    return Math.floor(d/86400) + ' روز پیش';
  } catch { return '-'; }
}

// Load prices
async function loadPrices() {
  try {
    const d = await fx(API + '/api/prices', 30000);
    if (!d.data || !d.data.length) return;
    document.getElementById('ticker').innerHTML = d.data.map(p => {
      const f = FLAGS[p.symbol] || '💱';
      const up = p.direction === 'up';
      const s = p.change_pct >= 0 ? '+' : '';
      return '<div class="t-item"><span>' + f + '</span><span style="color:#a0aec0">' + p.name + '</span><span>' + p.price + '</span><span class="' + (up ? 't-up' : 't-down') + '">' + (up ? '▲' : '▼') + ' ' + s + p.change_pct + '%</span></div>';
    }).join('');
  } catch(e) { console.error('prices', e); }
}

// Load live scan
async function loadLive() {
  try {
    const d = await fx(API + '/api/scan');
    if (d.status === 'waiting' || !d.data) {
      document.getElementById('cards').innerHTML = '<div class="empty"><div class="empty-icon">⏳</div><div>اولین اسکن در حال اجراست</div></div>';
      return;
    }
    renderCards(d.data);
    document.getElementById('scanInfo').innerHTML = '<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.8rem;color:#a0aec0;display:flex;justify-content:space-between"><span style="color:var(--green);font-weight:700">● زنده</span><span>' + d.count + ' جفت‌ارز در حال رصد</span></div>';
    document.getElementById('lastUpdate').textContent = 'بروزرسانی: ' + new Date().toLocaleTimeString('fa-IR');
  } catch(e) {
    document.getElementById('cards').innerHTML = '<div class="empty"><div class="empty-icon">⏳</div><div>سرور در حال بیدار شدن...<br><small>چند لحظه صبر کن و Refresh بزن</small></div></div>';
  }
}

function renderCards(scans) {
  const sorted = [...scans].sort((a,b) => {
    const ah = a.direction ? 1 : 0, bh = b.direction ? 1 : 0;
    if (ah !== bh) return bh - ah;
    return Math.abs(b.score||0) - Math.abs(a.score||0);
  });
  document.getElementById('cards').innerHTML = sorted.map(s => {
    const f = FLAGS[s.symbol] || '💱';
    let badge = '<span class="badge wait">⏳ انتظار</span>';
    let cls = '';
    if (s.direction === 'BUY') { badge = '<span class="badge buy">▲ خرید</span>'; cls = 'buy'; }
    if (s.direction === 'SELL') { badge = '<span class="badge sell">▼ فروش</span>'; cls = 'sell'; }
    const zc = s.zone === 'PREMIUM' ? 'red' : 'green';
    let sltp = '';
    if (s.direction && s.suggested_sl && s.suggested_tp) {
      sltp = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)">' +
        '<div style="background:var(--bg);border-radius:10px;padding:10px;text-align:center"><div style="font-size:.7rem;color:var(--muted)">🛑 حد ضرر</div><div style="color:var(--red);font-family:monospace;font-weight:700">' + fmtP(s.suggested_sl, s.symbol) + '</div></div>' +
        '<div style="background:var(--bg);border-radius:10px;padding:10px;text-align:center"><div style="font-size:.7rem;color:var(--muted)">🎯 حد سود</div><div style="color:var(--green);font-family:monospace;font-weight:700">' + fmtP(s.suggested_tp, s.symbol) + '</div></div>' +
      '</div>';
    }
    let reasonsArr = Array.isArray(s.reasons) ? s.reasons : (typeof s.reasons === 'string' ? s.reasons.split('|').filter(Boolean) : []);
    let reasonsBlock = reasonsArr.length ? '<div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)"><div style="font-size:.75rem;color:var(--muted);margin-bottom:8px">دلایل تحلیل:</div>' + reasonsArr.map(r => '<div style="font-size:.78rem;color:#a0aec0;padding:6px 10px;background:rgba(59,130,246,.05);border-right:2px solid var(--accent);border-radius:4px;margin-bottom:4px">✓ ' + r + '</div>').join('') + '</div>' : '';
    const sc = s.score > 0 ? 'green' : s.score < 0 ? 'red' : '';
    return '<div class="card ' + cls + '">' +
      '<div class="card-head"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:1.3rem">' + f + '</span><div><div class="name">' + (s.name || s.symbol) + '</div><div class="code">' + s.symbol + '</div></div></div>' + badge + '</div>' +
      '<div class="row"><span class="lbl">💰 قیمت</span><span class="val">' + fmtP(s.current_price, s.symbol) + '</span></div>' +
      '<div class="row"><span class="lbl">📈 روند</span><span class="val" style="color:' + (s.htf_trend === 'BULLISH' ? 'var(--green)' : s.htf_trend === 'BEARISH' ? 'var(--red)' : 'var(--muted)') + '">' + trendFa(s.htf_trend) + '</span></div>' +
      '<div class="row"><span class="lbl">📍 ناحیه</span><span class="val ' + zc + '">' + zoneFa(s.zone) + '</span></div>' +
      '<div class="row"><span class="lbl">🎯 امتیاز</span><span class="val ' + sc + '">' + fmtS(s.score) + '</span></div>' +
      sltp + reasonsBlock + '</div>';
  }).join('');
}

// Load signals
async function loadSignals() {
  try {
    const arr = await fx(API + '/api/signals');
    if (!arr || !arr.length) {
      document.getElementById('signalsList').innerHTML = '<div class="empty"><div class="empty-icon">🎯</div><div>هنوز سیگنالی ثبت نشده</div></div>';
      return;
    }
    document.getElementById('signalsList').innerHTML = arr.map(s => {
      const f = FLAGS[s.symbol] || '💱';
      let sb = '<span class="badge wait">باز</span>';
      if (s.status === 'WIN') sb = '<span class="badge buy">✓ سود</span>';
      if (s.status === 'LOSS') sb = '<span class="badge sell">✗ ضرر</span>';
      if (s.status === 'EXPIRED') sb = '<span class="badge wait">⏰ منقضی</span>';
      const dc = s.direction === 'BUY' ? 'buy' : 'sell';
      const dl = s.direction === 'BUY' ? '▲ خرید' : '▼ فروش';
      let pnl = '';
      if (s.pnl_pips != null) pnl = '<div class="row"><span class="lbl">📊 نتیجه</span><span class="val ' + (s.pnl_pips >= 0 ? 'green' : 'red') + '">' + (s.pnl_pips > 0 ? '+' : '') + parseFloat(s.pnl_pips).toFixed(1) + ' پیپ</span></div>';
      let reasonsArr = Array.isArray(s.reasons) ? s.reasons : (typeof s.reasons === 'string' ? s.reasons.split('|').filter(Boolean) : []);
      let reasons = reasonsArr.length ? '<div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)"><div style="font-size:.75rem;color:var(--muted);margin-bottom:8px">دلایل:</div>' + reasonsArr.map(r => '<div style="font-size:.78rem;color:#a0aec0;padding:6px 10px;background:rgba(59,130,246,.05);border-right:2px solid var(--accent);border-radius:4px;margin-bottom:4px">✓ ' + r + '</div>').join('') + '</div>' : '';
      return '<div class="card"><div class="card-head"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:1.3rem">' + f + '</span><div><div class="name">' + (s.name||s.symbol) + '</div><span class="badge ' + dc + '" style="margin-top:4px">' + dl + '</span></div></div>' + sb + '</div>' +
        '<div class="row"><span class="lbl">💰 ورود</span><span class="val">' + fmtP(s.entry, s.symbol) + '</span></div>' +
        '<div class="row"><span class="lbl">🛑 SL</span><span class="val red">' + fmtP(s.sl, s.symbol) + '</span></div>' +
        '<div class="row"><span class="lbl">🎯 TP</span><span class="val green">' + fmtP(s.tp, s.symbol) + '</span></div>' +
        '<div class="row"><span class="lbl">📊 امتیاز</span><span class="val">' + fmtS(s.score) + '</span></div>' + pnl +
        '<div class="row"><span class="lbl">🕐 زمان</span><span class="val">' + timeAgo(s.created_at) + '</span></div>' + reasons + '</div>';
    }).join('');
  } catch(e) {
    document.getElementById('signalsList').innerHTML = '<div class="empty">خطا در بارگذاری</div>';
  }
}

// Load stats
async function loadStats() {
  try {
    const s = await fx(API + '/api/stats');
    const wr = (s.win_rate || 0) * 100;
    document.getElementById('statsContent').innerHTML =
      '<div class="hero"><div style="font-size:.8rem;color:var(--muted);margin-bottom:8px">وین ریت</div><div class="hero-val" style="color:' + (wr >= (s.min_win_rate*100) ? 'var(--green)' : 'var(--red)') + '">' + wr.toFixed(1) + '%</div></div>' +
      '<div class="grid2">' +
      '<div class="stat-box"><div class="stat-val" style="color:var(--accent)">' + s.total + '</div><div class="stat-lbl">کل معاملات</div></div>' +
      '<div class="stat-box"><div class="stat-val green">' + s.wins + '</div><div class="stat-lbl">برد</div></div>' +
      '<div class="stat-box"><div class="stat-val red">' + s.losses + '</div><div class="stat-lbl">باخت</div></div>' +
      '<div class="stat-box"><div class="stat-val yellow">' + parseFloat(s.profit_factor).toFixed(2) + '</div><div class="stat-lbl">Profit Factor</div></div>' +
      '<div class="stat-box"><div class="stat-val ' + (s.total_pips >= 0 ? 'green' : 'red') + '">' + (s.total_pips > 0 ? '+' : '') + s.total_pips + '</div><div class="stat-lbl">پیپ کل</div></div>' +
      '<div class="stat-box"><div class="stat-val" style="color:var(--accent)">' + s.open_signals + '</div><div class="stat-lbl">سیگنال باز</div></div>' +
      '</div>' +
      '<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;font-size:.8rem;line-height:2;color:#a0aec0">' +
      '<div>🎯 حداقل معاملات: <b style="color:#fff">' + s.min_trades + '</b></div>' +
      '<div>🎯 حداقل وین ریت: <b style="color:#fff">' + (s.min_win_rate*100).toFixed(0) + '%</b></div>' +
      '<div>🎯 حداقل PF: <b style="color:#fff">' + s.min_profit_factor + '</b></div>' +
      '<div>🎯 مدت تست: <b style="color:#fff">' + s.test_duration_days + ' روز</b></div>' +
      '</div>';
  } catch(e) {
    document.getElementById('statsContent').innerHTML = '<div class="empty">خطا در بارگذاری</div>';
  }
}

function manualRefresh() {
  loadPrices();
  loadLive();
  loadSignals();
  loadStats();
}

// Auto-load on start
loadPrices();
loadLive();
setInterval(loadPrices, 30000);
setInterval(loadLive, 60000);
</script>
</body>
  </html>
