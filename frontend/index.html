<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sina Quant">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/static/style.css">
  <title>Sina Quant</title>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-icon">📊</span>
    <h1>Sina Quant</h1>
  </div>
  <button id="refreshBtn" class="icon-btn" aria-label="بازخوانی">
    <span class="refresh-icon">🔄</span>
  </button>
</header>

<!-- 📊 تیکر قیمت زنده -->
<section id="tickerBar" class="ticker-bar">
  <div id="tickerContent" class="ticker-content">
    <div class="ticker-loading">در حال دریافت قیمت‌ها...</div>
  </div>
</section>

<nav class="tabs">
  <button class="tab active" data-tab="live">
    <span class="tab-icon">📈</span>
    <span>لحظه‌ای</span>
  </button>
  <button class="tab" data-tab="signals">
    <span class="tab-icon">🎯</span>
    <span>سیگنال‌ها</span>
  </button>
  <button class="tab" data-tab="stats">
    <span class="tab-icon">📊</span>
    <span>آمار</span>
  </button>
</nav>

<main>

  <section id="tab-live" class="tab-content active">
    <div id="scanInfo" class="scan-info"></div>
    <div id="loading" class="spinner">
      <div class="spinner-dot"></div>
      <div class="spinner-dot"></div>
      <div class="spinner-dot"></div>
      <p>در حال دریافت تحلیل...</p>
    </div>
    <div id="cards"></div>
  </section>

  <section id="tab-signals" class="tab-content">
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">همه</button>
      <button class="filter-btn" data-filter="OPEN">باز</button>
      <button class="filter-btn" data-filter="WIN">سود</button>
      <button class="filter-btn" data-filter="LOSS">ضرر</button>
    </div>
    <div id="signalsList"></div>
  </section>

  <section id="tab-stats" class="tab-content">
    <div id="statsContent"></div>
  </section>

</main>

<footer>
  <div class="footer-info">
    <span>Sina Quant v2.1</span>
    <span id="lastUpdate">-</span>
  </div>
</footer>

<script src="/static/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('✅ SW ثبت شد'))
        .catch(err => console.log('❌ خطای SW:', err));
    });
  }
</script>

</body>
    </html>
